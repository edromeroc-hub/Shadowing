name: ShadowingNative
options:
  bundleIdPrefix: com.edromero
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.19.2
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 10.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CA26GYKPQP
    CODE_SIGN_STYLE: Automatic
    OTHER_LDFLAGS: "$(inherited) -ObjC"
targets:
  ShadowingNative:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: ShadowingNative
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: GoogleSignIn
        product: GoogleSignIn
    info:
      path: ShadowingNative/Info.plist
      properties:
        CFBundleDisplayName: ShadowingApp
        # Número da build fica aqui: o `xcodegen generate` reescreve o Info.plist.
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        YouTubeDataAPIKey: "$(YOUTUBE_DATA_API_KEY)"
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.656360211453-1onjmjbgr5co5gba44ne7rjminsd3bu6
    entitlements:
      path: ShadowingNative/ShadowingNative.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.edromero.shadowing.next
        PRODUCT_NAME: Shadowing Native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
